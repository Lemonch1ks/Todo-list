{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">Tags</h1>

    <a href="{% url 'list:add_tags' %}" class="btn btn-primary">
      Add
    </a>
  </div>

  {% if tags %}
    <table class="table">
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>

      {% for tag in tags %}
        <tr>
          <td>
              {{ tag.name }}
          </td>
          <td>
              <a href="{% url 'list:tags_update' pk=tag.pk %}" class="btn btn-secondary">
                Update
              </a>
            </td>
            <td>
              <a href="{% url 'list:tags_delete' pk=tag.pk %}" class="btn btn-secondary">
                Delete
              </a>
            </td>
        </tr>
      {% endfor %}
    </table>

  {% else %}
      <p>There are no tags.</p>
  {% endif %}
{% endblock %}
